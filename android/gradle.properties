org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# MAX_PATH. Das Repo liegt tief (rund 105 Zeichen bis zur Wurzel), und AGPs
# Zwischenpfade sind lang; zusammen reissen sie die 260-Zeichen-Grenze, und der
# Bau bricht mit einer Meldung ab, die von einem Codefehler nicht zu
# unterscheiden ist. Deshalb baut Gradle NEBEN dem Repo. Das fertige APK holt
# ./dev.ps1 build-apk danach nach android/out/ zurueck.
#
# Wer das nicht braucht (kurzer Ablageort, oder Windows mit langen Pfaden), nimmt
# die Zeile heraus - dann baut Gradle wieder in android/app/build/.
aruco.buildRoot=C:/aruco-android-build
