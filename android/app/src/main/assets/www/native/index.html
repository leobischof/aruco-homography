<!DOCTYPE html>
<!--
  Die Startseite der Android-Huelle.

  Sie ist NICHT die Oberflaeche - die steht unveraendert unter /index.html und
  wird von hier aus geoeffnet. Diese Seite ist die Werkbank fuer das, was auf
  einem Telefon bis heute niemand geprueft hat: laeuft der native Kern, findet er
  Marker auf einem echten Foto, und haelt er die Toleranz aus shared/fixtures/?

  Sie leiht sich alles: die Stilvorlagen aus /css/, das Sprachmodul aus /js/, die
  Kataloge aus /i18n/. Eigene Farben oder eine eigene Uebersetzung waeren eine
  zweite Oberflaeche - und die driftet.
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ArUco-Homographie</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="/brand/fonts/Montserrat-VariableFont_wght.woff2">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/forms.css">

  <style>
    /* Nur, was es in den geliehenen Stilvorlagen noch nicht gibt. Alles andere
       kommt von dort - eine eigene Farbe hier waere der Anfang eines zweiten
       Entwurfssystems. */
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
    .verdict { font-weight: 700; letter-spacing: 0.04em; }
    .verdict.pass { color: var(--primary); }
    .verdict.fail { color: var(--destructive); }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 0.8em;
            overflow-wrap: anywhere; }
    .rows { display: grid; gap: 0.5rem; }
    .row-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  </style>
</head>
<body>

<header class="app-header">
  <a class="brand-mark" href="https://bischof-snowboards.com" target="_blank" rel="noopener">
    <img data-theme-only="light" src="/brand/logo-dark.svg" alt=""
         data-i18n-attr="alt:ui.header.logo_alt">
    <img data-theme-only="dark" src="/brand/logo-light.svg" alt=""
         data-i18n-attr="alt:ui.header.logo_alt">
  </a>

  <div class="header-titles">
    <h1 data-i18n="ui.android.title"></h1>
    <p class="header-sub" data-i18n="ui.android.subtitle"></p>
  </div>

  <div class="header-actions">
    <select class="lang-select" id="lang-select"
            data-i18n-attr="aria-label:ui.language.label,title:ui.language.label"></select>
    <!-- Beschriftung und Titel setzt app.js: sie haengen am Thema, nicht am
         Katalogschluessel allein (heller Grund -> "auf dunkel schalten"). -->
    <button type="button" class="btn-icon" id="theme-toggle">
      <svg data-theme-only="light" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" width="20" height="20" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
      </svg>
      <svg data-theme-only="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<main class="app-main">

  <!-- 1 - Der Kern -->
  <section class="card">
    <h2 data-i18n="ui.android.native_heading"></h2>
    <dl class="kv" id="native-info"></dl>
    <p class="error-slot" id="native-error" hidden></p>
  </section>

  <!-- 2 - Pruefstand -->
  <section class="card">
    <h2 data-i18n="ui.android.conformance_heading"></h2>
    <p class="hint" data-i18n="ui.android.conformance_explain"></p>
    <div class="row-actions">
      <button type="button" class="btn btn-primary" id="run-conformance"
              data-i18n="ui.android.conformance_run"></button>
    </div>
    <div class="rows" id="conformance-out"></div>
  </section>

  <!-- 3 - Detektor am Foto -->
  <section class="card">
    <h2 data-i18n="ui.android.detect_heading"></h2>
    <p class="hint" data-i18n="ui.android.detect_explain"></p>
    <div class="row-actions">
      <button type="button" class="btn btn-outline" id="pick-photo"
              data-i18n="ui.android.detect_pick"></button>
      <button type="button" class="btn btn-outline" id="take-photo"
              data-i18n="ui.android.detect_camera"></button>
      <button type="button" class="btn btn-primary" id="run-detect" disabled
              data-i18n="ui.android.detect_run"></button>
    </div>
    <div class="rows" id="detect-out"></div>
  </section>

  <!-- 4 - Markerblatt -->
  <section class="card">
    <h2 data-i18n="ui.android.sheet_heading"></h2>
    <p class="hint" data-i18n="ui.android.sheet_explain"></p>
    <div class="row-actions">
      <button type="button" class="btn btn-primary" id="save-sheet"
              data-i18n="ui.android.sheet_save"></button>
      <button type="button" class="btn btn-outline" id="share-sheet"
              data-i18n="ui.android.sheet_share"></button>
    </div>
    <div class="rows" id="sheet-out"></div>
  </section>

  <!-- 5 - Die vollstaendige Oberflaeche -->
  <section class="card">
    <h2 data-i18n="ui.android.full_heading"></h2>
    <p class="hint" data-i18n="ui.android.full_explain"></p>
    <div class="row-actions">
      <button type="button" class="btn btn-outline" id="open-full"
              data-i18n="ui.android.full_open"></button>
    </div>
  </section>

</main>

<script type="module" src="/native/app.js"></script>
</body>
</html>
