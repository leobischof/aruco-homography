name: CI

# Jeder Pull Request auf die beiden geschuetzten Zweige, und jeder Push nach
# develop. NICHT bei Push nach master: dort laeuft release.yml, und der baut
# ohnehin alles - zweimal dieselbe Suite waere nur Wartezeit.
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

# Ein zweiter Push auf denselben Zweig macht den ersten Lauf gegenstandslos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-python:
    name: test-python
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-windows-toolchain
      - name: pytest
        shell: pwsh
        run: .\dev.ps1 run-tests

  test-cpp:
    name: test-cpp
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-windows-toolchain
      # check-jni ruft apksigner-nahe Java-Werkzeuge nicht, aber eine echte JVM -
      # ohne JDK bricht es mit Ruecklaufwert 1 ab und sagt nicht, warum.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Den C++-Kern bauen
        shell: pwsh
        run: .\dev.ps1 build-core
      - name: Dieselbe Suite gegen den C++-Kern
        shell: pwsh
        run: .\dev.ps1 run-tests-cpp
      - name: Die JNI-Schicht auf einer JVM
        shell: pwsh
        run: .\dev.ps1 check-jni

  test-js:
    name: test-js
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-windows-toolchain
      - name: Die reine JavaScript-Rechnung
        shell: pwsh
        run: .\dev.ps1 run-tests-js
      - name: Dieselbe Suite, aber das PDF aus web/pdf/
        shell: pwsh
        run: .\dev.ps1 run-tests-pdf-js
