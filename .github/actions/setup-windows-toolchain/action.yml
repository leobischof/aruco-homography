name: Windows-Werkzeugkette
description: >
  Python, Node, das OpenCV-Windows-SDK und auf Wunsch Inno Setup herrichten -
  alles, was dev.ps1 auf einem Windows-Laeufer vorfinden muss.

inputs:
  opencv-version:
    description: Fassung des OpenCV-Windows-SDK
    required: false
    default: '5.0.0'
  inno-setup:
    description: Inno Setup mitinstallieren (nur build-installer braucht es)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: '3.13'

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    # Das venv ins Zwischenlager. Confirm-Deps in dev.ps1 legt es sonst bei
    # jedem Lauf neu an, und opencv-python-headless allein sind rund 90 MB.
    # Der Schluessel traegt die aufgeloeste Python-Fassung
    # (steps.python.outputs.python-version), nicht bloss 'py313': setup-python
    # loest '3.13' auf einen konkreten Patch auf, und python -m venv schreibt
    # dessen absoluten hostedtoolcache-Pfad in venv/pyvenv.cfg. Wandert das
    # Laeuferbild auf den naechsten 3.13-Patch, zeigt ein wiederhergestelltes
    # venv auf einen Interpreter, den es dort nicht mehr gibt - dev.ps1 nutzt
    # venv\Scripts\python.exe fuer alles.
    # Was der Schluessel weiterhin nicht sieht: requirements.txt ist bis auf
    # eine Untergrenze unversioniert. Driftet das aufgeloeste Paketset, ohne
    # dass die Datei sich aendert, bleibt der Hash gleich und das
    # Zwischenlager greift trotzdem - und dev.ps1s eigene Selbstheilung
    # (Test-DepsInstalled/Get-RequirementsHash) prueft denselben Hash gegen
    # einen Stempel im wiederhergestellten venv, installiert also auch dann
    # nichts nach.
    - name: venv aus dem Zwischenlager
      uses: actions/cache@v4
      with:
        path: venv
        key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

    - name: OpenCV-SDK aus dem Zwischenlager
      id: opencv
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}\opencv
        key: opencv-windows-${{ inputs.opencv-version }}

    # Das ist ein selbstentpackendes 7z-Archiv und KEIN Installer: -o<Ziel> -y
    # packt es aus, ohne irgendetwas in die Registrierung zu schreiben. Darin
    # liegt opencv/build/, und genau dort sucht Find-OpenCVDir die
    # OpenCVConfig.cmake.
    - name: OpenCV-SDK holen
      if: steps.opencv.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $version = '${{ inputs.opencv-version }}'
        $url = "https://github.com/opencv/opencv/releases/download/$version/opencv-$version-windows.exe"
        $exe = Join-Path $env:RUNNER_TEMP 'opencv-sfx.exe'
        Write-Host "==> $url"
        Invoke-WebRequest -Uri $url -OutFile $exe
        # Start-Process -Wait und NICHT `& $exe`: der Entpacker ist eine
        # GUI-Anwendung (Windows-Subsystem). Darauf wartet PowerShell nicht -
        # der Aufruf kehrt sofort zurueck, waehrend das Auspacken noch laeuft,
        # und laesst $LASTEXITCODE unberuehrt. Im ersten Schritt eines Laufs
        # ist die Variable damit $null, `$null -ne 0` ist wahr, und die
        # Pruefung darunter meldete einen Fehlschlag, den es nicht gab:
        # "OpenCV self-extractor failed (exit )." - mit leerer Klammer, weil
        # nie ein Ruecklaufwert entstanden ist.
        $sfx = Start-Process -FilePath $exe -ArgumentList "-o$env:RUNNER_TEMP", '-y' -Wait -PassThru
        if ($sfx.ExitCode -ne 0) { throw "OpenCV self-extractor failed (exit $($sfx.ExitCode))." }
        Remove-Item $exe

    - name: OpenCV_DIR bekanntgeben
      shell: pwsh
      run: |
        $dir = Join-Path $env:RUNNER_TEMP 'opencv\build'
        $marker = Join-Path $dir 'OpenCVConfig.cmake'
        if (-not (Test-Path $marker)) { throw "OpenCV liegt nicht, wo erwartet: $marker" }
        # utf8NoBOM statt utf8: eine Byte-Order-Mark vor dem ersten Namen
        # macht die Variable fuer GITHUB_ENV unlesbar (aus OpenCV_DIR wird
        # <BOM>OpenCV_DIR), spaetere Schritte sehen sie schlicht nicht, und
        # dev.ps1 faellt auf einen Pfad neben dem Repo zurueck, den es auf
        # einem Laeufer gar nicht gibt - und meldet ein fehlendes SDK, obwohl
        # der Fehler hier lag. Ob ein explizites -Encoding utf8 in pwsh (was
        # diese Aktion nutzt) ueberhaupt eine BOM schriebe, ist hier nicht
        # geklaert; utf8NoBOM ist in pwsh so oder so eindeutig BOM-frei.
        # utf8NoBOM gibt es in Windows PowerShell 5.1 nicht - wechselt jemand
        # spaeter zu shell: powershell, bricht das laut mit einem
        # Parameterfehler statt still wieder eine BOM zu schreiben. Kein
        # -Encoding waere schlimmer: 5.1s Default fuer Out-File ist UTF-16LE,
        # was die Datei still verderben wuerde.
        "OpenCV_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8NoBOM

    - name: Inno Setup
      if: inputs.inno-setup == 'true'
      shell: pwsh
      run: choco install innosetup --no-progress -y
